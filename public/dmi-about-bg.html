<!--
  DMI ABOUT PAGE - MACHINERY 3D BACKGROUND
  1) <style> -> <head>
  2) SVG defs + <div class="dmi-bg"> -> About page wrapper ke andar sabse pehle
  3) Page content wrapper: position:relative; z-index:1; background: transparent
  4) <script> -> </body> se pehle
-->
<style>.dmi-defs{position:absolute;width:0;height:0;overflow:hidden}
.dmi-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#f4f3ee}
.dmi-bg .lay{position:absolute;perspective:1100px;transform:translate3d(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px - var(--sy,0)*var(--d)*.03px),0);will-change:transform}
.dmi-bg .floor-wrap{position:absolute;left:0;right:0;bottom:0;height:62%;perspective:520px;perspective-origin:50% 0;-webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%)}
.dmi-bg .floor{position:absolute;left:-60%;right:-60%;top:0;height:200%;transform-origin:50% 0;transform:rotateX(74deg);background-image:linear-gradient(rgba(41,43,39,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(41,43,39,.13) 1px,transparent 1px);background-size:72px 72px;animation:dmiFloor 5s linear infinite}
@keyframes dmiFloor{to{background-position:0 72px}}
.dmi-bg .mach{position:relative;width:640px;height:520px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-28deg);opacity:.95}
.dmi-bg .gear{position:absolute;transform-style:preserve-3d;animation:dmiRot var(--w) linear infinite}
@keyframes dmiRot{from{transform:rotateZ(var(--a))}to{transform:rotateZ(var(--b))}}
.dmi-bg .ly{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;fill:#6e716a}
.dmi-bg .ly:nth-child(-n+3){fill:#8a8d85}
.dmi-bg .ly:nth-child(1){fill:url(#dmiSteel);stroke:rgba(41,43,39,.45);stroke-width:1.2}
.dmi-bg .gold .ly{fill:#8a6639}.dmi-bg .gold .ly:nth-child(-n+3){fill:#a77d4c}
.dmi-bg .gold .ly:nth-child(1){fill:url(#dmiGold)}
.dmi-bg .pipes{display:block;width:100%;height:220px}
.dmi-bg .flow{animation:dmiFlow 1.5s linear infinite}
@keyframes dmiFlow{to{stroke-dashoffset:-42}}
.dmi-bg .tank{display:block;opacity:.95}
@media(max-width:700px){.dmi-bg .hide-m{display:none}.dmi-bg .gears{left:30%!important;top:-4%!important;transform-origin:0 0}.dmi-bg .mach{transform:rotateX(58deg) rotateZ(-28deg) scale(.6)}}
@media(prefers-reduced-motion:reduce){.dmi-bg .gear,.dmi-bg .flow,.dmi-bg .floor{animation:none}}

}

<script>(function(){
